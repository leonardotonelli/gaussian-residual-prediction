[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-residual-prediction"
version = "0.1.0"
description = "Code and evidence for Gaussian Residual Prediction without an EMA Target Network"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [{name = "Leonardo Tonelli"}, {name = "Makoto Yamada"}]
dependencies = ["numpy>=1.24,<2", "PyYAML>=6,<7", "torch>=2.5.1,<2.9"]

[project.optional-dependencies]
paper = ["matplotlib>=3.9,<3.10"]
test = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/leonardotonelli/gaussian-residual-prediction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
